<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>Label Mapper</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>

    <div id="main-container">
        <h1>Label Mapper</h1>
        <div class="main-controls">
            <button id="start-new-record-button">➕ Start New Record</button>
            <div class="toggle-switch">
                <input type="checkbox" id="auto-capture-toggle" name="auto-capture">
                <label for="auto-capture-toggle">Auto-Capture Address</label>
            </div>
        </div>

        <div id="data-section">
            <div id="table-wrapper">
                <table id="data-table">
                    <thead>
                        <tr>
                            <th>QR URL</th>
                            <th>Name & Address</th>
                            <th>Image</th>
                            <th></th> </tr>
                    </thead>
                    <tbody></tbody>
                </table>
            </div>
            <div class="table-actions">
                 <button id="copy-table-button">Copy Table</button>
            </div>
        </div>
    </div>

    <div id="capture-modal" class="hidden" role="dialog" aria-modal="true">
        <div class="modal-content">
            <div id="scanner-view">
                <div id="video-wrapper">
                    <video id="video-feed" playsinline></video>
                    <canvas id="frame-canvas" class="hidden"></canvas>
                    <div id="overlay"></div>
                </div>
                <p id="status-message">Starting camera...</p>
                <div id="loader" class="hidden">
                    <div class="spinner"></div>
                    <p>Processing...</p>
                </div>
                <div id="scanner-controls">
                    <button id="capture-btn" class="hidden">Capture Address</button>
                    <button id="cancel-button" class="secondary-btn">Cancel</button>
                </div>
            </div>

            <div id="validation-view" class="hidden">
                <h3>Validate and Correct</h3>
                <label for="qr-url">QR Code URL:</label>
                <input type="text" id="qr-url" name="qr-url">

                <label for="name-address">Name & Address:</label>
                <textarea id="name-address" name="name-address" rows="4"></textarea>

                <div class="modal-buttons">
                    <button id="save-button">Save Record</button>
                </div>
            </div>
        </div>
    </div>

    <div id="confidence-modal" class="hidden">
        <div class="modal-content">
            <h3 id="confidence-title">Low Scan Quality</h3>
            <p>The extracted text has a low confidence score. You can accept it and correct it later, or retry for a better scan.</p>
            <div id="confidence-preview">
                <h4>Extracted Text Preview:</h4>
                <pre id="confidence-text-preview"></pre>
            </div>
            <div class="modal-buttons">
                <button id="retry-scan-button" class="secondary-btn">Retry</button>
                <button id="accept-scan-button">Accept & Continue</button>
            </div>
        </div>
    </div>
    
    <script src='https://cdn.jsdelivr.net/npm/tesseract.js@5/dist/tesseract.min.js'></script>
    <script src="https://cdn.jsdelivr.net/npm/jsqr@1.4.0/dist/jsQR.js"></script>
    
    <script src="js/app.js"></script>

</body>
</html>
