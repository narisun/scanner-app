<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>MAF Fulfillment App</title>
    <link rel="icon" href="/images/favicon-32x32-1.png" type="image/x-icon">
    <link rel="stylesheet" href="css/style.css">
</head>
<body>

    <div id="login-container" class="login-wrapper">
        <div class="login-box">
            <img src="/images/maf-touch-icon.png" alt="MedicAlert Logo" class="maf-logo" onerror="this.style.display='none'">
            <h2>MAF Fulfillment App</h2>
            <form id="login-form">
                <div class="form-group">
                    <label for="username">Username</label>
                    <input type="text" id="username" required autocomplete="username">
                </div>
                <div class="form-group">
                    <label for="password">Password</label>
                    <input type="password" id="password" required autocomplete="current-password">
                </div>
                <p id="login-error" class="hidden" style="color: var(--danger-color); margin-top: 10px;"></p>
                <div class="login-action">
                    <button type="submit" id="login-btn">Secure Login</button>
                </div>
            </form>
        </div>
    </div>

    <div id="main-container" class="hidden">
        <div class="top-nav">
            <div class="nav-left">
                <img src="/images/maf-touch-icon.png" alt="MedicAlert Logo" class="nav-logo" onerror="this.style.display='none'">
                <span class="nav-brand">MedicAlert</span>
            </div>
            <div class="nav-right">
                <span id="logged-in-username" class="logged-in-user"></span>
                <span class="nav-divider">|</span>
                <a href="user-guide.html" class="nav-link">User Guide</a>
                <span class="nav-divider">|</span>
                <a href="#" id="logout-link" class="nav-link logout">Logout</a>
            </div>
        </div>

        <h1>MAF Fulfillment App</h1>
        <h3 id="org-header" style="text-align: center; color: var(--dark-gray); margin-top: -10px; margin-bottom: 20px;"></h3>
        
        <div class="main-controls">
            <button id="start-new-record-button" disabled>Loading Engine...</button>
        </div>

        <div id="data-section">
            <div id="cards-container" class="cards-stack"></div>
        </div>

        <div id="image-modal" class="hidden" role="dialog" aria-modal="true">
            <div class="modal-content" style="text-align: center;">
                <img id="viewer-image" src="" alt="Scanned Image" style="max-width: 100%; max-height: 70vh; border-radius: 4px;" />
                <div class="modal-buttons" style="display: flex; justify-content: center; margin-top: 15px;">
                    <button id="close-image-btn" class="secondary-btn">Close Image</button>
                </div>
            </div>
        </div>
    </div>

    <div id="capture-modal" class="hidden" role="dialog" aria-modal="true" aria-labelledby="modal-title">
        <div class="modal-content">
            <div id="scanner-view">
                <div id="video-wrapper">
                    <video id="video-feed" playsinline></video>
                    <canvas id="frame-canvas" class="hidden"></canvas>
                    <div id="overlay"></div>
                </div>
                <p id="status-message" aria-live="polite">Starting camera...</p>
                <div id="loader" class="hidden">
                    <div class="spinner"></div>
                    <p>Processing...</p>
                </div>
                <div id="scanner-controls">
                    <button id="capture-btn" class="hidden">Capture Address</button>
                    <button id="cancel-button" class="secondary-btn">Cancel</button>
                </div>
            </div>

            <div id="validation-view" class="hidden">
                <h3 id="modal-title">Validate and Correct</h3>
                
                <label for="qr-url">QR Code URL:</label>
                <input type="text" id="qr-url" name="qr-url" maxlength="500">

                <label for="name-address">Combined Address:</label>
                <textarea id="name-address" name="name-address" rows="4" maxlength="250"></textarea>

                <label for="record-notes">Notes / Instructions (Max 120 chars):</label>
                <textarea id="record-notes" name="record-notes" rows="2" maxlength="120" placeholder="Add information for manual review..."></textarea>

                <div class="modal-buttons">
                    <button id="save-button">Save Record</button>
                </div>
            </div>
        </div>
    </div>

    <div id="confidence-modal" class="hidden" role="dialog" aria-modal="true">
        <div class="modal-content">
            <h3 id="confidence-title">Low Scan Quality</h3>
            <p>The extracted text has a low confidence score. You can accept it and correct it later, or retry for a better scan.</p>
            <div id="confidence-preview">
                <h4>Extracted Text Preview:</h4>
                <pre id="confidence-text-preview"></pre>
            </div>
            <div class="modal-buttons">
                <button id="retry-scan-button" class="secondary-btn">Retry</button>
                <button id="accept-scan-button">Accept & Continue</button>
            </div>
        </div>
    </div>
    
    <script src='https://cdn.jsdelivr.net/npm/tesseract.js@5/dist/tesseract.min.js'></script>
    <script src="https://cdn.jsdelivr.net/npm/jsqr@1.4.0/dist/jsQR.js"></script>
    <script type="module" src="js/main.js"></script>   
</body>
</html>
